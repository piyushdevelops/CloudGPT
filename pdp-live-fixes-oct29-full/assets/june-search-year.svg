</g><path class="sparkle" d="m29 2 .7 2.3L32 5l-2.3.7L29 8l-.7-2.3L26 5l2.3-.7Z" fill="#BFAEE9" stroke="#17151B" stroke-width=".55" stroke-linejoin="round"/></svg>

