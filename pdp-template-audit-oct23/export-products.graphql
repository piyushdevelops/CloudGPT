mutation ExportProductTemplateAssignments {
  bulkOperationRunQuery(
    query: """
      {
        products {
          edges {
            node {
              id
              title
              productType
              templateSuffix
              status
            }
          }
        }
      }
    """
  ) {
    bulkOperation {
      id
      status
    }
    userErrors {
      field
      message
    }
  }
}
