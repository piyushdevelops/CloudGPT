:left;min-height:58px;overflow:hidden;position:relative;text-decoration:none}.mystery:before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#c9afff33 45%,transparent 65%);transform:translateX(-120%);transition:transform .7s}.mystery:hover:before{transform:translateX(120%)}.mystery strong{font-size:13px}.mystery small{font-size:11px;color:#d6c5ec;margin-left:15px}.mystery .reveal{background:#d6c5ec;color:#24232b;padding:6px 12px;border-radius:100px;font-size:11px;font-weight:700}.box{display:inline-block;margin-right:10px;transition:transform .3s}.mystery:hover .box{transform:rotate(-12deg) scale(1.2)}.hint{text-align:center;font-size:11px;color:#706379;margin-top:20px}.active-note{font-size:10px;text-transform:uppercase;letter-spacing:.13em;margin:16px 0 0;text-align:center;color:#6f5b84}.tab[aria-selected=true]:after{content:'';position:absolute;bottom:6px;left:50%;width:4px;height:4px;border-radius:50%;background:#24232b}@keyframes arrive{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}

</style></head><body><div class="note">HERO NAVIGATION · INTERACTIVE DESIGN PREVIEW</div><main class="wrap"><section class="hero"><div class="stage" id="panel" role="tabpanel" aria-labelledby="tab-0"><div><p class="eyebrow" id="eyebrow"></p><h1 id="headline"></h1><p class="copy" id="copy"></p><a class="cta" id="cta"></a></div><div class="visual" id="visual"></div></div><div class="nav"><div class="tabs" role="tablist" aria-label="Shop by planner type"></div><a class="mystery" href="https://thejuneshop.com/products/mystery-box-limited-drop" target="_blank" rel="noopener"><div><strong><span class="box" aria-hidden="true">✦</span>Mystery Box</strong><small>For the pleasantly surprised.</small></div><span class="reveal">Reveal the box ↗</span></a></div></section><p class="hint">Four equal category cards. One separate surprise. Click a card to explore.</p></main><script>
const cdn='https://cdn.shopify.com/s/files/1/0177/5579/9606/files/';const items=[{name:'Undated',sub:'Start any day',head:'Make<br>room.',copy:'For big plans. And everyday ones.',cta:'Shop undated',url:'https://thejuneshop.com/collections/undated-yearly-planners',image:'home_1.png'},{name:'Limited Edition',sub:'Planner + extras',head:'Your planner.<br>With extras.',copy:'A little more to look forward to.',cta:'Shop Limited Edition',url:'https://thejuneshop.com/collections/limited-edition',image:'2_68a94c51-a771-4ca8-b34b-68f1046d01a4.png'},{name:'2027 Dated',sub:'Coming soon',head:'Next year.<br>Loading…',copy:'2027 planners. Get the first look.',cta:'Explore the launch',url:'https://thejuneshop.com/?preview_theme_id=187527266499',kind:'calendar'},{name:'Life Journals',sub:'Every new chapter',head:'Life happens.<br>Keep it.',copy:'For the moments you want to remember.',cta:'Explore life journals',url:'https://thejuneshop.com/collections/planners-journals',image:'Untitled_design_6_fce55137-4866-4230-b2fc-6219b95d159b.png'}];
