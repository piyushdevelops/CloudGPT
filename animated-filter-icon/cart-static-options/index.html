<!doctype html>

<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3fa;color:#171717;font:14px system-ui,sans-serif}main{max-width:1260px;margin:auto;padding:32px 24px 60px}h1{font-size:clamp(26px,4vw,40px);letter-spacing:-1.5px;margin:6px 0 10px}p{color:#615d69;line-height:1.5;margin:0 0 22px}.intro{display:flex;gap:28px;align-items:center;justify-content:space-between;margin-bottom:26px}.header-demo{min-width:310px;max-width:370px;background:white;border:1px solid #d8d4df;border-radius:16px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:18px}.header-demo strong{font-size:20px;letter-spacing:-1px}.target{display:grid;place-items:center;width:44px;height:44px;position:relative}.badge{position:absolute;top:0;right:0;border-radius:20px;background:#BFAEE9;min-width:16px;height:16px;font-size:10px;font-weight:800;display:grid;place-items:center}.caption{margin:8px 0 0;font-size:12px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{appearance:none;text-align:left;cursor:pointer;color:inherit;background:white;border:2px solid transparent;border-radius:16px;padding:16px 12px;font:inherit;box-shadow:0 0 0 1px #e0dce7}.card:hover{border-color:#d5c9ef}.card[aria-pressed=true]{border-color:#79639c;background:#fcfaff}.card:focus-visible{outline:3px solid #79639c;outline-offset:3px}.label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;min-height:24px}.label b{font-size:14px;color:#716180}.large{display:block;width:72px;height:72px;margin:28px auto 26px}.sizes{display:flex;gap:30px;justify-content:center;align-items:end;border-top:1px solid #eeeaf4;padding-top:14px}.sizes>span{display:grid;gap:9px;justify-items:center;color:#77717f;font-size:10px}.sizes img{object-fit:contain}.download{display:inline-block;color:#171717;font-size:12px;margin-top:9px}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){main{padding:20px 16px 40px}.intro{display:block}.header-demo{min-width:0;max-width:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.label{font-size:11px}.large{width:64px;height:64px}.card{padding:12px 9px}.sizes{gap:24px}}

<main><div class="intro"><div><h1>Shape first. Motion later.</h1><p>15 static cart directions. Compare the small icons, then tap a card to see it in the header.</p></div><div><div class="header-demo"><span class="target"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><strong>the june shop</strong><span class="target"><img id="chosen" src="cart-01.svg" width="24" height="24" alt="Everyday tote"><span class="badge">1</span></span></div><p class="caption" id="selection" aria-live="polite">01 · Everyday tote — actual 24px</p><a class="download" id="download" href="cart-01.svg" download>Download selected SVG</a></div></div><div class="grid"><button class="card" data-number="01" data-name="Everyday tote" aria-label="Preview option 01: Everyday tote" aria-pressed="false"><span class="label"><b>01</b>Everyday tote</span><img class="large" src="cart-01.svg" alt=""><span class="sizes"><span><img src="cart-01.svg" width="24" height="24" alt="">24px</span><span><img src="cart-01.svg" width="32" height="32" alt="">32px</span></span></button>

<script>
const cards=document.querySelectorAll('.card');cards[0].setAttribute('aria-pressed','true');for(const card of cards){card.addEventListener('click',()=>{for(const other of cards)other.setAttribute('aria-pressed',String(other===card));const number=card.dataset.number,name=card.dataset.name;document.querySelector('#chosen').src='cart-'+number+'.svg';document.querySelector('#chosen').alt=name;document.querySelector('#selection').textContent=number+' · '+name+' — actual 24px';document.querySelector('#download').href='cart-'+number+'.svg';});}
