<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-labelledby="title"><title id="title">Search — counting forward to 2027</title>
<style>
.year-reel{animation:years 10s cubic-bezier(.3,0,.2,1) forwards;transform-box:view-box}
.search-mark{transform-origin:9.5px 9px;animation:landing 10s linear forwards;transform-box:view-box}
.lens{fill:#fff;animation:highlight 10s linear forwards}
@keyframes years{0%,4%{transform:translateY(0)}6%,8%{transform:translateY(-10px)}10%,12%{transform:translateY(-20px)}14%,16%{transform:translateY(-30px)}18%,20%{transform:translateY(-40px)}22%,24%{transform:translateY(-50px)}26%,30%{transform:translateY(-60px)}36%,48%{transform:translateY(-70px)}58%,100%{transform:translateY(-80px)}}
@keyframes landing{0%,57%,66%,100%{transform:scale(1)}60%{transform:scale(1.08)}63%{transform:scale(.98)}}
@keyframes highlight{0%,56%{fill:#fff}60%,68%{fill:#D5C4F0}80%,100%{fill:#EFE8FA}}
@media(prefers-reduced-motion:reduce){.year-reel{animation:none;transform:translateY(-80px)}.search-mark{animation:none}.lens{animation:none;fill:#EFE8FA}}
</style>
<defs><clipPath id="year-window"><rect x="4.6" y="5.3" width="9.8" height="7.4" rx=".7"/></clipPath></defs>
<g class="search-mark">
<circle class="lens" cx="9.5" cy="9" r="6.5" stroke="#111" stroke-width="2.2"/>
<path d="m14.3 13.8 7 7" fill="none" stroke="#111" stroke-width="3.8" stroke-linecap="round"/>
<path d="m17.5 17 3.5 3.5" fill="none" stroke="#BFAEE9" stroke-width="1.7" stroke-linecap="round"/>
<g clip-path="url(#year-window)"><g class="year-reel" fill="#111" font-family="Arial,Helvetica,sans-serif" font-size="7.5" font-weight="900" text-anchor="middle"><text x="9.5" y="11.6">19</text><text x="9.5" y="21.6">20</text><text x="9.5" y="31.6">21</text><text x="9.5" y="41.6">22</text><text x="9.5" y="51.6">23</text><text x="9.5" y="61.6">24</text><text x="9.5" y="71.6">25</text><text x="9.5" y="81.6">26</text><text x="9.5" y="91.6">27</text></g></g>
</g></svg>
